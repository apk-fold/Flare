name: Test sur émulateur

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**', 'i18n/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    name: Émulateur Android 15 (captures d'écran)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version de développement
        working-directory: android
        run: ../scripts/ci-run.sh "Gradle" ./gradlew assembleDebug --no-daemon
      - name: Accélération KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-test.sh
      - name: Enregistrer les captures dans le dépôt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Captures d'écran (émulateur)"
            git push
          fi
